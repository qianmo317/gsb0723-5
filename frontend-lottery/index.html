<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D幸运抽奖</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="background-layer"></div>

    <div class="particles" id="particles"></div>

    <div class="main-container">
        <aside class="prize-panel">
            <div class="panel-header">
                <h2>🎁 奖品设置</h2>
                <button class="btn btn-small btn-primary" data-action="show-add-prize">+ 添加奖品</button>
            </div>
            <div class="prize-list" id="prizeList"></div>
            <div class="panel-actions">
                <button class="btn btn-secondary" data-action="show-winner-list">📋 中奖名单</button>
                <button class="btn btn-secondary" data-action="show-settings">⚙️ 设置</button>
            </div>
        </aside>

        <main class="lottery-area">
            <div class="lottery-title">
                <h1 id="currentPrizeName">请先选择奖品</h1>
                <p id="currentPrizeInfo">点击左侧奖品开始抽奖</p>
            </div>

            <div class="lottery-3d-container">
                <div class="lottery-sphere" id="lotterySphere"></div>
                <div class="winner-display" id="winnerDisplay">
                    <span class="winner-name" id="winnerName"></span>
                </div>
            </div>

            <div class="lottery-controls">
                <button class="btn btn-lottery" id="lotteryBtn" disabled>
                    <span id="lotteryBtnText">开始抽奖</span>
                </button>
            </div>
        </main>

        <aside class="participant-panel">
            <div class="panel-header">
                <h2>👥 参与名单</h2>
                <span class="participant-count" id="participantCount">0人</span>
            </div>
            <div class="panel-actions-top">
                <button class="btn btn-small btn-secondary" data-action="generate-random">随机</button>
                <button class="btn btn-small btn-secondary" data-action="trigger-upload">导入</button>
                <button class="btn btn-small btn-secondary" data-action="download-template">模板</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
            </div>
            <div class="participant-list" id="participantList"></div>
            <div class="panel-footer">
                <button class="btn btn-danger btn-small" data-action="clear-participants">清空名单</button>
            </div>
        </aside>
    </div>

    <div class="modal" id="addPrizeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加奖品</h3>
                <button class="modal-close" data-action="close-modal" data-modal="addPrizeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>奖品名称</label>
                    <input type="text" id="prizeName" placeholder="例如：一等奖" maxlength="20">
                </div>
                <div class="form-group">
                    <label>中奖人数</label>
                    <input type="number" id="prizeCount" placeholder="例如：3" min="1" max="100">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-action="close-modal" data-modal="addPrizeModal">取消</button>
                <button class="btn btn-primary" data-action="add-prize">确认添加</button>
            </div>
        </div>
    </div>

    <div class="modal" id="winnerListModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>🏆 中奖名单</h3>
                <button class="modal-close" data-action="close-modal" data-modal="winnerListModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="winner-list-container" id="winnerListContainer"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-action="export-winners">导出名单</button>
                <button class="btn btn-primary" data-action="close-modal" data-modal="winnerListModal">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ 系统设置</h3>
                <button class="modal-close" data-action="close-modal" data-modal="settingsModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>背景图片</label>
                    <div class="file-upload-area" data-action="trigger-bg-upload">
                        <span id="bgUploadText">点击上传背景图片</span>
                        <input type="file" id="bgInput" accept="image/*" style="display:none">
                    </div>
                    <div class="bg-preview-container" id="bgPreviewContainer" style="display:none;">
                        <img id="bgPreviewImg" src="" alt="背景预览">
                        <button class="btn btn-small btn-danger" data-action="clear-bg-preview">移除</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>抽奖速度</label>
                    <select id="lotterySpeed">
                        <option value="fast">快速</option>
                        <option value="normal" selected>正常</option>
                        <option value="slow">慢速</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" data-action="reset-all-data">重置所有数据</button>
                <button class="btn btn-primary" data-action="save-settings">保存设置</button>
            </div>
        </div>
    </div>

    <div class="modal" id="winnerResultModal">
        <div class="modal-content modal-winner">
            <div class="modal-header">
                <h3>🎉 恭喜中奖</h3>
                <button class="modal-close" data-action="close-result">&times;</button>
            </div>
            <div class="modal-body winner-result-body">
                <div class="winner-prize-name" id="resultPrizeName"></div>
                <div class="winner-info" id="resultWinnerInfo"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" data-action="close-result">确定</button>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirmTitle">确认操作</h3>
                <button class="modal-close" data-action="confirm-cancel">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage" style="text-align: center; font-size: 16px; line-height: 1.8;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-action="confirm-cancel">取消</button>
                <button class="btn btn-primary" data-action="confirm-ok">确定</button>
            </div>
        </div>
    </div>

    <div class="modal" id="promptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="promptTitle">请输入</h3>
                <button class="modal-close" data-action="prompt-cancel">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label id="promptLabel"></label>
                    <input type="text" id="promptInput" placeholder="">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-action="prompt-cancel">取消</button>
                <button class="btn btn-primary" data-action="prompt-submit">确定</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/lib/xlsx.full.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
